server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: eureka-server-discovery

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    eviction-interval-timer-in-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true